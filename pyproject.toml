[project]
name = "ecologits-calculator"
version = "1.0.0"
description = "Front-end for the EcoLogits library to display the environmental footprint of generative AI models."
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "ecologits>=0.11.0,<0.13.0",
    "openpyxl>=3.1.0",
    "pandas>=3.0.5",
    "pint>=0.24.4",
    "plotly>=6.2.0",
    "streamlit>=1.47.1",
    "tiktoken>=0.9.0",
]

[tool.uv.sources]
ecologits = { git = "https://github.com/mlco2/ecologits" }

[dependency-groups]
dev = [
    "watchdog>=6.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "mypy>=1.7.0",
    "types-requests>=2.31.0",
    "pre-commit>=3.5.0",
    "pip-audit>=2.6.0",
    "ruff>=0.14.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"
fix = false

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "RUF",    # Ruff-specific rules
    "D",      # pydocstyle
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package
    "RUF001",
    "D107",   # Missing docstring in __init__
    "N806",   # Variable in function should be lowercase
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["src"]
lines-between-types = 1

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
allow_redefinition = true
warn_unused_ignores = true

[tool.uv]
exclude-newer = "2 weeks"
